    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Ignore HMR WebSocket errors as per environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket') ||
          event.reason.message?.includes('vite:ws') ||
          String(event.reason).includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('vite:ws') ||
          event.filename?.includes('@vite/client')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-amber-500/20 selection:text-amber-200">
